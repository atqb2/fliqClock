<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="50%" stop-color="#1c1c1f"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#08080a"/>
  <!-- Card Container -->
  <g filter="url(#shadow)">
    <!-- Card Upper Half -->
    <path d="M 96,80 L 416,80 A 40,40 0 0 1 456,120 L 456,254 L 56,254 L 56,120 A 40,40 0 0 1 96,80 Z" fill="url(#bgGrad)"/>
    <!-- Card Lower Half -->
    <path d="M 56,258 L 456,258 L 456,392 A 40,40 0 0 1 416,432 L 96,432 A 40,40 0 0 1 56,392 Z" fill="#141417"/>
    <!-- Center Split Line -->
    <line x1="56" y1="256" x2="456" y2="256" stroke="#050507" stroke-width="4"/>
    <!-- Hinges -->
    <rect x="52" y="246" width="10" height="20" rx="3" fill="#2c2c32" stroke="#111" stroke-width="1.5"/>
    <rect x="450" y="246" width="10" height="20" rx="3" fill="#2c2c32" stroke="#111" stroke-width="1.5"/>
    <!-- Digits "12" -->
    <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif" font-size="220" font-weight="900" fill="#f4f4f6" text-anchor="middle" letter-spacing="-6">12</text>
  </g>
</svg>
